# Liveness pilot over the kernel's user-visible step specifications. This is its own Cargo workspace and is
# excluded from the kernel workspace, so neither `verify-workspace.sh`, `verify-pipeline.sh`, nor the monolith
# verifies it. Run `liveness/verify-liveness.sh`.
[workspace]
members = ["."]

[package]
name = "veriflat_liveness"
version = "0.1.0"
license = "MIT"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
vstd = { path = "../verus/source/vstd" }
veriflat_kernel_core = { path = "../crates/veriflat_kernel_core" }
veriflat_u_facts = { path = "../noninterference/u_facts" }
veriflat_map_4k = { path = "../crates/veriflat_map_4k" }
veriflat_syscall_merge_2m = { path = "../crates/veriflat_syscall_merge_2m" }
veriflat_syscall_split_2m = { path = "../crates/veriflat_syscall_split_2m" }
veriflat_syscall_alloc_quota = { path = "../crates/veriflat_syscall_alloc_quota" }
veriflat_syscall_schedule = { path = "../crates/veriflat_syscall_schedule" }
veriflat_syscall_new_thread = { path = "../crates/veriflat_syscall_new_thread" }
veriflat_syscall_new_process = { path = "../crates/veriflat_syscall_new_process" }
veriflat_syscall_new_container = { path = "../crates/veriflat_syscall_new_container" }
veriflat_syscall_mmap_4k = { path = "../crates/veriflat_syscall_mmap_4k" }
veriflat_syscall_unmap_4k = { path = "../crates/veriflat_syscall_unmap_4k" }
veriflat_syscall_mmap_2m = { path = "../crates/veriflat_syscall_mmap_2m" }
veriflat_syscall_unmap_2m = { path = "../crates/veriflat_syscall_unmap_2m" }
veriflat_syscall_mmap_1g = { path = "../crates/veriflat_syscall_mmap_1g" }
veriflat_syscall_unmap_1g = { path = "../crates/veriflat_syscall_unmap_1g" }
veriflat_syscall_iommu_map_4k = { path = "../crates/veriflat_syscall_iommu_map_4k" }
veriflat_syscall_iommu_unmap_4k = { path = "../crates/veriflat_syscall_iommu_unmap_4k" }
veriflat_syscall_ipc = { path = "../crates/veriflat_syscall_ipc" }
veriflat_syscall_cpu_hotplug = { path = "../crates/veriflat_syscall_cpu_hotplug" }
veriflat_syscall_pci = { path = "../crates/veriflat_syscall_pci" }
veriflat_syscall_kill_process = { path = "../crates/veriflat_syscall_kill_process" }
veriflat_syscall_thread_exit = { path = "../crates/veriflat_syscall_thread_exit" }
veriflat_noninterference = { path = "../noninterference" }

[package.metadata.verus]
verify = true
