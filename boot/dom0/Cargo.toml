[package]
name = "dom0"
version = "0.1.0"
license = "MIT"
edition = "2021"
publish = false

[features]
# For a kernel built with `no-timer`: runs only the timings, which need no tick, and skips every phase
# that needs preemption, an idle CPU's tick, or an offline request noticed at a tick.
no-timer = []

[dependencies]
vsys = { path = "../vsys" }
log = "0.4.19"
