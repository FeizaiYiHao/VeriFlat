[package]
name = "dom0"
version = "0.1.0"
license = "MIT"
edition = "2021"
publish = false

[features]
# For a kernel built with `no-timer`: runs only the timings, which need no tick, and skips every phase
# that needs preemption, an idle CPU's tick, or an offline request noticed at a tick.
no-timer = []
# Focused syscall 54 integration test; exits before the general benchmark suite.
split-test = []
# Focused permission-backed mmap zeroing regression.
zero-test = []
# Focused EDU device-to-RAM DMA revocation regression.
dma-write-test = []
# The E810 (ice) packet benchmark, run first and alone; skipped without an E810 function (see src/ice_bench.rs).
ice-bench = []
# The E810 benchmark with the driver linked in and in a process of its own, IPC per batch (see src/ice_xproc.rs).
ice-xproc = []
# `ice-xproc` on the software device model of `ice::mock` instead of an E810 (measures the IPC, not a NIC).
ice-mock = ["ice-xproc", "ice/mock"]

[dependencies]
vsys = { path = "../vsys" }
ice = { path = "../ice" }
log = "0.4.19"
